<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秋招实习岗位聚合</title>
<link rel="stylesheet" href="style.css">
<script>
  // 这段要放在页面最前面、样式表之后立刻执行：
  // 先把上次选的主题应用上，再开始画页面。
  // 否则会出现"先闪一下白色再变黑"的情况，很刺眼。
  (function () {
    var saved = localStorage.getItem("theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  })();
</script>
</head>
<body>

<header class="top-bar">
  <div>
    <h1>秋招实习岗位聚合</h1>
    <p class="update-info">
      <span id="freshnessDot" class="freshness-dot" hidden></span>
      <span id="updateInfo">数据加载中…</span>
    </p>
  </div>
  <button type="button" id="themeToggle" class="theme-toggle">🌙 夜间</button>
</header>

<main>
  <section class="controls">
    <input id="searchInput" type="text" placeholder="搜索职位类型 / 公司 / 标签，例如：产品、字节跳动、五险一金" />
    <select id="citySelect">
      <option value="">全部城市</option>
    </select>
    <select id="companySelect">
      <option value="">全部公司</option>
    </select>
    <select id="tierSelect">
      <option value="">全部档位</option>
      <option value="1">秋招可转正</option>
      <option value="2">大厂实习</option>
      <option value="3">中厂实习</option>
      <option value="4">普通实习</option>
    </select>
    <label class="new-only-label">
      <input type="checkbox" id="newOnlyCheckbox" />
      只看新职位
    </label>
    <label class="new-only-label">
      <input type="checkbox" id="officialOnlyCheckbox" />
      只看官网校招
    </label>
  </section>

  <p class="result-count" id="resultCount"></p>

  <section id="jobList" class="job-list"></section>

  <p id="emptyMessage" class="empty-message" hidden>没有找到符合条件的职位，换个关键词试试？</p>
</main>

<script src="app.js"></script>
</body>
</html>
